version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # One grouped minor/patch PR per month. ALL major version bumps are ignored
    # (deferred to the pre-launch Fastify 5 / NestJS 11 / better-auth 1.6
    # migration — see .planning/notes/dependency-cve-deferral.md). Dependabot
    # SECURITY updates are exempt from `ignore` and still flow when a real
    # advisory lands.
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: monthly
