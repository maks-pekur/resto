name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22.22.1"
  PNPM_VERSION: "9.15.0"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  affected:
    name: Affected ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: install
    # AUDIT #5: force the isolation suite to fail-closed. ubuntu-latest ships a
    # Docker daemon, so the testcontainer specs run normally; if Docker ever goes
    # missing they now hard-error instead of silently degrading to describe.skip.
    env:
      RESTO_REQUIRE_DOCKER: "1"
      NEXT_PUBLIC_API_ORIGIN: "https://api.ci.invalid"
      ADMIN_WEB_URL: "https://admin.ci.invalid"
      WEBSITE_URL: "https://website.ci.invalid"
      INTERNAL_API_TOKEN: "ci-build-internal-token-placeholder"
      ACTIVE_BRAND_COOKIE_SECRET: "ci-build-active-brand-cookie-secret-placeholder"
    strategy:
      fail-fast: false
      matrix:
        target: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      - name: Run nx affected ${{ matrix.target }}
        run: pnpm exec nx affected -t ${{ matrix.target }} --parallel=3

  format:
    name: Format check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # OSS scan; no license token required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: install
    # Audit findings should not block merges immediately — they often
    # surface advisories with no fixed version yet. We surface them
    # loudly in CI logs and triage out-of-band.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps, fail on high severity)
        run: pnpm audit --prod --audit-level=high

  openapi-drift:
    name: OpenAPI drift check
    runs-on: ubuntu-latest
    needs: install
    # AppModule wiring requires DB/NATS/S3 env vars before NestFactory can
    # render the OpenAPI document, even though no real services are
    # contacted during emit. Placeholders below are non-functional and
    # only satisfy env-schema + adapter-construction validation. The S3
    # adapter throws on missing values regardless of NODE_ENV (see
    # s3-signed-image-url.adapter.ts — schema regression noted there).
    env:
      DATABASE_URL: postgres://x@localhost:5432/x
      NATS_URL: nats://localhost:4222
      NATS_DISABLED: "true"
      OTEL_DISABLED: "true"
      NODE_ENV: development
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: x
      S3_SECRET_KEY: x
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm openapi:check (D-4a-08 drift gate)
        # The root-level `pnpm openapi:check` script (tools/openapi-check.ts)
        # regenerates docs/api/openapi.yaml + packages/api-client/src/generated/
        # and asserts no diff against the committed artefacts. Local devs run
        # the same single command to reproduce a CI drift failure.
        run: pnpm openapi:check

  api-e2e:
    name: API e2e (testcontainers)
    runs-on: ubuntu-latest
    needs: install
    timeout-minutes: 30
    # Absent from CI until 2026-08-28. Three separate rots traced to that gap —
    # see .planning/notes/e2e-audit-2026-08-28-findings.md. Each spec starts its
    # own Postgres + NATS via testcontainers, so no `services:` block is needed;
    # ubuntu-latest ships a Docker daemon.
    env:
      # AUDIT #5: fail closed if Docker ever goes missing, rather than silently
      # degrading every testcontainer spec to describe.skip.
      RESTO_REQUIRE_DOCKER: "1"
      # PINNED ON PURPOSE — do not remove and do not source a developer .env.
      # The audit found `security.e2e` reading as a security regression solely
      # because the local .env raises this to 1000 against a schema default of
      # 10, so its rotating-cookie test could never observe the 429 it asserts.
      RATE_LIMIT_AUTH_SIGNIN_PER_MIN: "10"
      RATE_LIMIT_AUTH_SIGNIN_PER_EMAIL_PER_MIN: "10"
      # Non-functional placeholders. with-real-stack.setup.ts supplies
      # DATABASE_URL / BETTER_AUTH_DATABASE_URL / NATS_URL / INTERNAL_API_TOKEN
      # from the containers it starts; these cover what it does not, and the S3
      # adapter throws on missing values regardless of NODE_ENV.
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: x
      S3_SECRET_KEY: x
      BETTER_AUTH_SECRET: ci-e2e-better-auth-secret-placeholder-32ch
      AUDIT_ERASURE_SALT: ci-e2e-erasure-salt-placeholder-32-chars
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: api e2e (one process per spec)
        # The isolation flags are load-bearing, not tuning: 26 e2e specs assign
        # process.env.RATE_LIMIT_AUTH_SIGNIN_PER_MIN in their own beforeAll, and
        # the shared vitest config runs every spec in ONE forked process
        # (singleFork: true). Batched, whichever spec ran last decides the limit
        # security.e2e then measures. Measured on 2026-08-28: batched 62/3,
        # isolated 64/1. Pinning env at the job level does NOT fix this — the
        # contamination happens inside the process, after the env is read.
        run: pnpm exec nx run api:e2e

  docker-api:
    name: Docker API boot smoke
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci_admin_pwd
          POSTGRES_DB: ci_resto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm --filter @resto/db db:migrate
        env:
          DATABASE_ADMIN_URL: postgres://ci_admin:ci_admin_pwd@localhost:5432/ci_resto
      - name: Provision roles
        run: |
          pnpm exec tsx --tsconfig packages/db/tsconfig.json packages/db/src/cli/provision-roles-ci.ts
        env:
          DATABASE_ADMIN_URL: postgres://ci_admin:ci_admin_pwd@localhost:5432/ci_resto
          APP_ROLE_PASSWORD: ci_app_role_pwd_1234
          AUTH_ROLE_PASSWORD: ci_auth_role_pwd_1234
      - name: Docker build
        run: docker build -f apps/api/Dockerfile -t api-smoke:ci .
      - name: Docker boot smoke
        run: |
          docker run --rm --network host \
            -e NODE_ENV=test \
            -e DATABASE_URL=postgres://resto_app:ci_app_role_pwd_1234@localhost:5432/ci_resto \
            -e BETTER_AUTH_DATABASE_URL=postgres://resto_auth:ci_auth_role_pwd_1234@localhost:5432/ci_resto \
            -e NATS_URL=nats://localhost:4222 \
            -e NATS_DISABLED=true \
            -e OTEL_DISABLED=true \
            -e BETTER_AUTH_BASE_URL=http://localhost:3000 \
            -e ADMIN_WEB_URL=http://localhost:3001 \
            -e INTERNAL_API_TOKEN=ci_internal_token_placeholder \
            -e BETTER_AUTH_SECRET=ci_better_auth_secret_placeholder_32ch \
            -e AUDIT_ERASURE_SALT=ci_audit_erasure_salt_placeholder_32ch \
            -e S3_ENDPOINT=http://localhost:9000 \
            -e S3_ACCESS_KEY=ci_s3_access_key \
            -e S3_SECRET_KEY=ci_s3_secret_key \
            --name api-smoke-run \
            api-smoke:ci &
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf http://localhost:3000/healthz; then
              echo "Boot smoke passed."
              docker rm -f api-smoke-run >/dev/null 2>&1 || true
              exit 0
            fi
          done
          echo "Boot smoke FAILED — container did not serve /healthz within 20s. Container logs:"
          docker logs api-smoke-run 2>&1 | tail -40 || echo "(no container — check the docker run invocation)"
          docker rm -f api-smoke-run >/dev/null 2>&1 || true
          exit 1
