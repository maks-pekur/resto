name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22.22.1"
  PNPM_VERSION: "9.15.0"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

  affected:
    name: Affected ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: install
    strategy:
      fail-fast: false
      matrix:
        target: [lint, typecheck, test, build]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v5
      - name: Run nx affected ${{ matrix.target }}
        run: pnpm exec nx affected -t ${{ matrix.target }} --parallel=3

  format:
    name: Format check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.event.pull_request.head.sha }} --verbose

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # OSS scan; no license token required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    needs: install
    # Audit findings should not block merges immediately — they often
    # surface advisories with no fixed version yet. We surface them
    # loudly in CI logs and triage out-of-band.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (production deps, fail on high severity)
        run: pnpm audit --prod --audit-level=high

  openapi-drift:
    name: OpenAPI drift check
    runs-on: ubuntu-latest
    needs: install
    # AppModule wiring requires DB/NATS/S3 env vars before NestFactory can
    # render the OpenAPI document, even though no real services are
    # contacted during emit. Placeholders below are non-functional and
    # only satisfy env-schema + adapter-construction validation. The S3
    # adapter throws on missing values regardless of NODE_ENV (see
    # s3-signed-image-url.adapter.ts — schema regression noted there).
    env:
      DATABASE_URL: postgres://x@localhost:5432/x
      NATS_URL: nats://localhost:4222
      NATS_DISABLED: "true"
      OTEL_DISABLED: "true"
      NODE_ENV: development
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: x
      S3_SECRET_KEY: x
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm openapi:check (D-4a-08 drift gate)
        # The root-level `pnpm openapi:check` script (tools/openapi-check.ts)
        # regenerates docs/api/openapi.yaml + packages/api-client/src/generated/
        # and asserts no diff against the committed artefacts. Local devs run
        # the same single command to reproduce a CI drift failure.
        run: pnpm openapi:check

  # docker-api job intentionally removed at ADR-0021 adoption.
  # Reason: pre-revenue MVP, no production deploy exists yet; a green Docker
  # build check would currently mask a latent runtime bug (`import.meta.dirname`
  # undefined in CJS bundle — see packages/db/src/roles.ts, auth-role.ts,
  # apps/api/src/openapi.ts). Reinstate when ADR-0021 Tier 6 (app propagation +
  # production deploy) becomes the active focus. Hosting direction per ADR-0011
  # (AWS) — revisit at that point.
