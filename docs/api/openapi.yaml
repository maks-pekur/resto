info:
  title: Resto API
  description: Resto multi-tenant SaaS backend.
  version: 0.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ProvisionTenantInputDto:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          pattern: ^[a-z]{2}(?:-[A-Z]{2})?$
          default: en
        defaultCurrency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
        - slug
        - displayName
        - defaultCurrency
    TenantResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        displayName:
          type: string
        status:
          type: string
        locale:
          type: string
        defaultCurrency:
          type: string
        primaryDomain:
          type: string
        stripeAccountId:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
        archivedAt:
          type: string
          nullable: true
        offboardingScheduledAt:
          type: string
          nullable: true
        offboardingExecutedAt:
          type: string
          nullable: true
        offboardingRequestedBy:
          type: string
          nullable: true
      required:
        - id
        - slug
        - displayName
        - status
        - locale
        - defaultCurrency
        - primaryDomain
        - stripeAccountId
        - createdAt
        - updatedAt
        - archivedAt
        - offboardingScheduledAt
        - offboardingExecutedAt
        - offboardingRequestedBy
    ProblemDetailsDto:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: number
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        correlationId:
          type: string
        traceId:
          type: string
      required:
        - type
        - title
        - status
        - instance
    ScheduleOffboardingInputDto:
      type: object
      properties:
        requestedBy:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - requestedBy
    SuspendTenantInputDto:
      type: object
      properties:
        requestedBy:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - requestedBy
    TenantDomainDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        kind:
          type: string
        isPrimary:
          type: boolean
        verifiedAt:
          type: string
          nullable: true
      required:
        - id
        - domain
        - kind
        - isPrimary
        - verifiedAt
    MeBrandsResponseDto:
      type: object
      properties:
        brands:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
              displayName:
                type: string
            required:
              - id
              - slug
              - displayName
        canViewAllBrands:
          type: boolean
      required:
        - brands
        - canViewAllBrands
    CreateBrandInputDto:
      type: object
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - slug
        - displayName
    MeBrandDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        displayName:
          type: string
      required:
        - id
        - slug
        - displayName
    SlugAvailabilityResponseDto:
      type: object
      properties:
        available:
          type: boolean
        suggestion:
          type: string
          nullable: true
      required:
        - available
        - suggestion
    BootstrapOwnerInputDto:
