info:
  title: Resto API
  description: Resto multi-tenant SaaS backend.
  version: 0.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ProvisionTenantInputDto:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        country:
          type: string
          enum:
            - UA
            - GB
            - ES
        locale:
          type: string
          pattern: ^[a-z]{2}(?:-[A-Z]{2})?$
        status:
          type: string
          enum:
            - pending_setup
            - active
      required:
        - slug
        - displayName
        - country
    TenantResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$
        displayName:
          type: string
        status:
          type: string
        locale:
          type: string
        country:
          type: string
          enum:
            - UA
            - GB
            - ES
        defaultCurrency:
          type: string
          pattern: ^[A-Z]{3}$
        theme:
          type: object
          properties:
            logoUrl:
              type: string
              format: uri
              nullable: true
              default: null
            primaryColor:
              type: string
              pattern: ^#[0-9A-Fa-f]{6}$
              nullable: true
              default: null
            font:
              type: string
              minLength: 1
              maxLength: 64
              nullable: true
              default: null
          nullable: true
        legalName:
          type: string
          nullable: true
        legalForm:
          type: string
          enum:
            - IP
            - OOO
            - LLC
            - SOLE_PROP
            - OTHER
          nullable: true
        taxId:
          type: string
          nullable: true
        paymentProvider:
          type: string
          enum:
            - stripe
        accountType:
          type: string
          enum:
            - express
            - standard
          nullable: true
        stripeChargesEnabled:
          type: boolean
        stripePayoutsEnabled:
          type: boolean
        stripeOnboardingStatus:
          type: string
          enum:
            - not_started
            - pending
            - complete
            - restricted
        stripeRequirementsDue:
          type: array
          items:
            type: string
          nullable: true
        primaryDomain:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        archivedAt:
          type: string
          nullable: true
        offboardingScheduledAt:
          type: string
          nullable: true
        offboardingExecutedAt:
          type: string
          nullable: true
        offboardingRequestedBy:
          type: string
          nullable: true
      required:
        - id
        - slug
        - displayName
        - status
        - locale
        - country
        - defaultCurrency
        - theme
        - legalName
        - legalForm
        - taxId
        - paymentProvider
        - accountType
        - stripeChargesEnabled
        - stripePayoutsEnabled
        - stripeOnboardingStatus
        - stripeRequirementsDue
        - primaryDomain
        - createdAt
        - updatedAt
        - archivedAt
        - offboardingScheduledAt
        - offboardingExecutedAt
        - offboardingRequestedBy
    ProblemDetailsDto:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: number
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        correlationId:
          type: string
        traceId:
          type: string
      required:
        - type
        - title
        - status
        - instance
    ScheduleOffboardingInputDto:
      type: object
      properties:
        requestedBy:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - requestedBy
    SuspendTenantInputDto:
      type: object
      properties:
        requestedBy:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - requestedBy
    TenantDomainDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        kind:
          type: string
        isPrimary:
          type: boolean
        verifiedAt:
          type: string
          nullable: true
      required:
        - id
        - domain
        - kind
        - isPrimary
        - verifiedAt
    AccountSessionResponseDto:
      type: object
      properties:
        clientSecret:
          type: string
      required:
        - clientSecret
    AccountLinkResponseDto:
      type: object
      properties:
        onboardingUrl:
          type: string
          format: uri
      required:
        - onboardingUrl
    OnboardingStatusResponseDto:
      type: object
      properties:
        accountType:
          type: string
          enum:
            - express
            - standard
          nullable: true
        onboardingStatus:
          type: string
          enum:
            - not_started
            - pending
            - complete
            - restricted
        chargesEnabled:
          type: boolean
        payoutsEnabled:
          type: boolean
        canAcceptPayments:
          type: boolean
        requirementsDue:
          type: array
          items:
            type: string
          nullable: true
      required:
        - accountType
        - onboardingStatus
        - chargesEnabled
        - payoutsEnabled
        - canAcceptPayments
        - requirementsDue
    OAuthStartResponseDto:
      type: object
      properties:
        authorizeUrl:
          type: string
          format: uri
      required:
        - authorizeUrl
    CreateLocationInputDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          minLength: 1
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          exclusiveMinimum: false
          maximum: 90
          exclusiveMaximum: false
        longitude:
          type: number
          minimum: -180
          exclusiveMinimum: false
          maximum: 180
          exclusiveMaximum: false
        timezone:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z_]+\/[A-Za-z_]+$
          nullable: true
        contacts:
          type: object
          properties:
            phone:
              type: string
              maxLength: 32
            email:
              type: string
              format: email
              maxLength: 255
          nullable: true
          default: null
      required:
        - name
        - address
        - latitude
        - longitude
    LocationResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        address:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        timezone:
          type: string
          nullable: true
        contacts:
          type: object
          properties:
            phone:
              type: string
              maxLength: 32
            email:
              type: string
              format: email
              maxLength: 255
          nullable: true
        status:
          type: string
          enum:
            - active
            - archived
        createdAt:
          type: string
        updatedAt:
          type: string
        archivedAt:
          type: string
          nullable: true
      required:
        - id
        - name
        - slug
        - address
        - latitude
        - longitude
        - timezone
        - contacts
        - status
        - createdAt
        - updatedAt
        - archivedAt
    UpdateLocationInputDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          minLength: 1
          maxLength: 500
        latitude:
          type: number
          minimum: -90
          exclusiveMinimum: false
          maximum: 90
          exclusiveMaximum: false
        longitude:
          type: number
          minimum: -180
          exclusiveMinimum: false
          maximum: 180
          exclusiveMaximum: false
        timezone:
          type: string
          maxLength: 64
          pattern: ^[A-Za-z_]+\/[A-Za-z_]+$
          nullable: true
        contacts:
          type: object
          properties:
            phone:
              type: string
              maxLength: 32
            email:
              type: string
              format: email
              maxLength: 255
          nullable: true
    ArchiveLocationResponseDto:
      type: object
      properties:
        scopedMemberCount:
          type: integer
          minimum: 0
          exclusiveMinimum: false
      required:
        - scopedMemberCount
    TableZoneResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        status:
          type: string
          enum:
            - active
            - archived
        tables:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              number:
                type: string
                minLength: 1
                maxLength: 32
              ordinal:
                type: integer
                minimum: 0
                exclusiveMinimum: true
              status:
                type: string
                enum:
                  - active
                  - archived
              qrUrl:
                type: string
            required:
              - id
              - number
              - ordinal
              - status
              - qrUrl
      required:
        - id
        - name
        - status
        - tables
    CreateTableZoneInputDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        tableCount:
          type: integer
          minimum: 0
          exclusiveMinimum: false
          maximum: 200
          exclusiveMaximum: false
      required:
        - name
        - tableCount
    RenameTableZoneInputDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - name
    TableZoneSummaryResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - archived
      required:
        - id
        - name
        - status
    ArchiveTableZoneResponseDto:
      type: object
      properties:
        zoneId:
          type: string
          format: uuid
        archivedTableCount:
          type: integer
          minimum: 0
          exclusiveMinimum: false
      required:
        - zoneId
        - archivedTableCount
    AddTablesInputDto:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          exclusiveMinimum: false
          maximum: 200
          exclusiveMaximum: false
          default: 1
    TableResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: string
          minLength: 1
          maxLength: 32
        ordinal:
          type: integer
          minimum: 0
          exclusiveMinimum: true
        status:
          type: string
          enum:
            - active
            - archived
        qrUrl:
          type: string
      required:
        - id
        - number
        - ordinal
        - status
        - qrUrl
    UpdateTableInputDto:
      type: object
      properties:
        number:
          type: string
          minLength: 1
          maxLength: 32
      required:
        - number
    TableResolutionDto:
      type: object
      properties:
        tableId:
          type: string
          format: uuid
        zoneName:
          type: string
        number:
          type: string
      required:
