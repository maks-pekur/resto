          additionalProperties:
            type: string
            minLength: 1
        price:
          type: string
          pattern: ^(?:0|[1-9]\d*)(?:\.\d{1,2})?$
        isDefault:
          type: boolean
          default: false
        sortOrder:
          type: integer
          minimum: 0
          exclusiveMinimum: false
          default: 0
      required:
        - menuItemId
        - name
        - price
    StopItemInputDto:
      type: object
      properties:
        itemId:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
          nullable: true
          default: null
      required:
        - itemId
    PhotoUploadUrlInputDto:
      type: object
      properties:
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
        sizeBytes:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 5242880
          exclusiveMaximum: false
      required:
        - contentType
        - sizeBytes
    PhotoUploadUrlResponseDto:
      type: object
      properties:
        uploadUrl:
          type: string
          format: uri
        s3Key:
          type: string
          minLength: 1
          maxLength: 1024
      required:
        - uploadUrl
        - s3Key
    PublishScheduledResponseDto:
      type: object
      properties:
        scheduled:
          type: boolean
        cancelAfterMs:
          type: integer
          minimum: 0
          exclusiveMinimum: false
      required:
        - scheduled
        - cancelAfterMs
    PublishCancelResponseDto:
      type: object
      properties:
        cancelled:
          type: boolean
      required:
        - cancelled
