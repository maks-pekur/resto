info:
  title: Resto API
  description: Resto multi-tenant SaaS backend.
  version: 0.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    SignUpInputDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        defaultCurrency: {}
        locale:
          type: string
          pattern: ^[a-z]{2}(?:-[A-Z]{2})?$
          default: en
      required:
        - email
        - password
        - displayName
        - defaultCurrency
    SignUpResponseDto:
      type: object
      properties:
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            displayName:
              type: string
            status:
              type: string
            primaryDomain:
              type: string
          required:
            - id
            - slug
            - displayName
            - status
            - primaryDomain
        userId:
          type: string
      required:
        - tenant
        - userId
    ProblemDetailsDto:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: number
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        traceId:
          type: string
      required:
        - type
        - title
        - status
        - instance
