openapi: 3.0.0
paths:
  /healthz:
    get:
      operationId: HealthController_liveness
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - health
  /readyz:
    get:
      operationId: HealthController_readiness
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - health
  /internal/v1/tenants:
    post:
      operationId: InternalTenantsController_provision
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionTenantInputDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "409":
          description: slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - tenancy
  /internal/v1/tenants/{id}/archive:
    post:
      operationId: InternalTenantsController_archive
      parameters: []
      responses:
        "204":
          description: ""
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - tenancy
  /internal/v1/tenants/scheduled-offboarding:
    get:
      operationId: InternalTenantsController_listScheduledOffboarding
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - tenancy
  /internal/v1/tenants/{id}/offboard:
    post:
      operationId: InternalTenantsController_scheduleOffboarding
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleOffboardingInputDto"
      responses:
        "202":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - tenancy
    delete:
      operationId: InternalTenantsController_cancelOffboarding
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - tenancy
  /v1/tenants/me:
    get:
      operationId: TenantsController_getMe
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantResponseDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - tenancy
  /v1/tenants/me/domains:
    get:
      operationId: TenantsController_getMeDomains
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantDomainDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - tenancy
  /v1/me:
    get:
      operationId: MeController_me
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - identity
  /v1/me/brands:
    get:
      operationId: MeBrandsController_getBrands
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeBrandsResponseDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - identity
    post:
      operationId: MeBrandsController_createBrand
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrandInputDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeBrandDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "409":
          description: brand slug taken globally
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - identity
  /v1/me/brands/slug-availability:
    get:
      operationId: MeBrandsController_slugAvailability
      parameters:
        - name: slug
          required: true
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlugAvailabilityResponseDto"
        "403":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - identity
  /internal/v1/tenants/{id}/owner:
    post:
      operationId: InternalBootstrapController_createOwner
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapOwnerInputDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapOwnerResponseDto"
        "401":
          description: missing or invalid internal token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "409":
          description: owner already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - identity
  /v1/signup:
    post:
      operationId: SignUpController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInputDto"
      responses:
        "201":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResponseDto"
        "400":
          description: sign-up could not be completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "409":
          description: email or slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - identity
  /v1/menu:
    get:
      operationId: PublicMenuController_menu
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedMenuDto"
        "404":
          description: no tenant resolved for host
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - catalog
  /v1/menu/items/{id}:
    get:
      operationId: PublicMenuController_item
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedMenuItemDto"
        "404":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - catalog
  /internal/v1/catalog/categories:
    post:
      operationId: InternalCatalogController_category
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCategoryInputDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - catalog/internal
  /internal/v1/catalog/items:
    post:
      operationId: InternalCatalogController_item
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertItemInputDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - catalog/internal
  /internal/v1/catalog/modifiers:
    post:
      operationId: InternalCatalogController_modifier
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertModifierInputDto"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - catalog/internal
  /internal/v1/catalog/publish:
    post:
      operationId: InternalCatalogController_publishMenu
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResponseDto"
        "401":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      tags:
        - catalog/internal
info:
  title: Resto API
  description: Resto multi-tenant SaaS backend.
  version: 0.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ProvisionTenantInputDto:
      type: object
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{1,62}[a-z0-9]$
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        locale:
          type: string
          pattern: ^[a-z]{2}(?:-[A-Z]{2})?$
          default: en
        defaultCurrency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
        - slug
        - displayName
        - defaultCurrency
    TenantResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        displayName:
          type: string
        status:
          type: string
        locale:
          type: string
        defaultCurrency:
          type: string
        primaryDomain:
          type: string
        stripeAccountId:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
        archivedAt:
          type: string
          nullable: true
        offboardingScheduledAt:
          type: string
          nullable: true
        offboardingExecutedAt:
          type: string
          nullable: true
        offboardingRequestedBy:
          type: string
          nullable: true
      required:
        - id
        - slug
        - displayName
        - status
        - locale
        - defaultCurrency
        - primaryDomain
        - stripeAccountId
        - createdAt
        - updatedAt
        - archivedAt
        - offboardingScheduledAt
        - offboardingExecutedAt
        - offboardingRequestedBy
    ProblemDetailsDto:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: number
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        traceId:
          type: string
      required:
        - type
        - title
        - status
        - instance
    ScheduleOffboardingInputDto:
      type: object
      properties:
        requestedBy:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - requestedBy
    TenantDomainDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        kind:
          type: string
        isPrimary:
          type: boolean
        verifiedAt:
          type: string
          nullable: true
      required:
        - id
        - domain
        - kind
        - isPrimary
        - verifiedAt
    MeBrandsResponseDto:
      type: object
      properties:
        brands:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
              displayName:
                type: string
            required:
              - id
              - slug
              - displayName
        canViewAllBrands:
          type: boolean
      required:
        - brands
        - canViewAllBrands
    CreateBrandInputDto:
      type: object
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 64
        displayName:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - slug
        - displayName
    MeBrandDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        displayName:
          type: string
      required:
        - id
        - slug
        - displayName
    SlugAvailabilityResponseDto:
      type: object
      properties:
        available:
          type: boolean
        suggestion:
          type: string
          nullable: true
      required:
        - available
        - suggestion
    BootstrapOwnerInputDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - email
        - password
        - name
    BootstrapOwnerResponseDto:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        userId:
          type: string
        organizationId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        requiresPasswordChange:
          type: boolean
      required:
        - tenantId
        - userId
        - organizationId
        - email
        - requiresPasswordChange
    SignUpInputDto:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        defaultCurrency:
          type: string
          pattern: ^[A-Z]{3}$
        locale:
          type: string
          pattern: ^[a-z]{2}(?:-[A-Z]{2})?$
          default: en
      required:
        - email
        - password
        - displayName
        - defaultCurrency
    SignUpResponseDto:
      type: object
      properties:
        tenant:
          type: object
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            displayName:
              type: string
            status:
              type: string
            primaryDomain:
              type: string
          required:
            - id
            - slug
            - displayName
            - status
            - primaryDomain
        userId:
          type: string
      required:
        - tenant
        - userId
    PublishedMenuDto:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 0
          exclusiveMinimum: false
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        brand:
          type: object
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            displayName:
              type: string
            theme:
              type: object
              properties:
                logoUrl:
                  type: string
                  format: uri
                  nullable: true
                primaryColor:
                  type: string
                  nullable: true
                font:
                  type: string
                  nullable: true
              required:
                - logoUrl
                - primaryColor
                - font
              nullable: true
          required:
            - id
            - slug
            - displayName
            - theme
          nullable: true
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
              name:
                type: object
                additionalProperties:
                  type: string
              description:
                type: object
                additionalProperties:
                  type: string
                nullable: true
              sortOrder:
                type: integer
                minimum: 0
                exclusiveMinimum: false
            required:
              - id
              - slug
              - name
              - description
              - sortOrder
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              slug:
                type: string
              categoryId:
                type: string
                format: uuid
              name:
                type: object
                additionalProperties:
                  type: string
              description:
                type: object
                additionalProperties:
                  type: string
                nullable: true
              basePrice:
                type: string
              currency:
                type: string
                pattern: ^[A-Z]{3}$
              imageUrl:
                type: string
                format: uri
                nullable: true
              allergens:
                type: array
                items:
                  type: string
              sortOrder:
                type: integer
                minimum: 0
                exclusiveMinimum: false
              variants:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: object
                      additionalProperties:
                        type: string
                    priceDelta:
                      type: string
                    isDefault:
                      type: boolean
                    sortOrder:
                      type: integer
                      minimum: 0
                      exclusiveMinimum: false
                  required:
                    - id
                    - name
                    - priceDelta
                    - isDefault
                    - sortOrder
              modifierIds:
                type: array
                items:
                  type: string
                  format: uuid
            required:
              - id
              - slug
              - categoryId
              - name
              - description
              - basePrice
              - currency
              - imageUrl
              - allergens
              - sortOrder
              - variants
              - modifierIds
        modifiers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: object
                additionalProperties:
                  type: string
              minSelectable:
                type: integer
                minimum: 0
                exclusiveMinimum: false
              maxSelectable:
                type: integer
                minimum: 0
                exclusiveMinimum: false
              isRequired:
                type: boolean
              options:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: object
                      additionalProperties:
                        type: string
                    priceDelta:
                      type: string
                    sortOrder:
                      type: integer
                      minimum: 0
                      exclusiveMinimum: false
                  required:
                    - id
                    - name
                    - priceDelta
                    - sortOrder
            required:
              - id
              - name
              - minSelectable
              - maxSelectable
              - isRequired
              - options
      required:
        - tenantId
        - version
        - currency
        - brand
        - categories
        - items
        - modifiers
    PublishedMenuItemDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        categoryId:
          type: string
          format: uuid
        name:
          type: object
          additionalProperties:
            type: string
        description:
          type: object
          additionalProperties:
            type: string
          nullable: true
        basePrice:
          type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        imageUrl:
          type: string
          format: uri
          nullable: true
        allergens:
          type: array
          items:
            type: string
        sortOrder:
          type: integer
          minimum: 0
          exclusiveMinimum: false
        variants:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: object
                additionalProperties:
                  type: string
              priceDelta:
                type: string
              isDefault:
                type: boolean
              sortOrder:
                type: integer
                minimum: 0
                exclusiveMinimum: false
            required:
              - id
              - name
              - priceDelta
              - isDefault
              - sortOrder
        modifierIds:
          type: array
          items:
            type: string
            format: uuid
      required:
        - id
        - slug
        - categoryId
        - name
        - description
        - basePrice
        - currency
        - imageUrl
        - allergens
        - sortOrder
        - variants
        - modifierIds
    UpsertCategoryInputDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-z0-9][a-z0-9-]*$
        name:
          type: object
          additionalProperties:
            type: string
            minLength: 1
        description:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          nullable: true
          default: null
        sortOrder:
          type: integer
          minimum: 0
          exclusiveMinimum: false
          default: 0
      required:
        - slug
        - name
        - description
    IdResponseDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
    UpsertItemInputDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-z0-9][a-z0-9-]*$
        name:
          type: object
          additionalProperties:
            type: string
            minLength: 1
        description:
          type: object
          additionalProperties:
            type: string
            minLength: 1
          nullable: true
          default: null
        basePrice:
          type: string
          pattern: ^(?:0|[1-9]\d*)(?:\.\d{1,2})?$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        imageS3Key:
          type: string
          minLength: 1
          nullable: true
          default: null
        allergens:
          type: array
          items:
            type: string
            minLength: 1
          nullable: true
          default: null
        status:
          type: string
          enum:
            - draft
            - published
            - archived
          default: draft
        sortOrder:
          type: integer
          minimum: 0
          exclusiveMinimum: false
          default: 0
      required:
        - categoryId
        - slug
        - name
        - description
        - basePrice
        - currency
    UpsertModifierInputDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: object
          additionalProperties:
            type: string
            minLength: 1
        minSelectable:
          type: integer
          minimum: 0
          exclusiveMinimum: false
          default: 0
        maxSelectable:
          type: integer
          minimum: 0
          exclusiveMinimum: false
          default: 1
        isRequired:
          type: boolean
          default: false
      required:
        - name
